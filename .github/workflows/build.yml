name: build

on:
  schedule:
    - cron: "42 5 * * *"      # Daily 05:42 UTC probe
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .github/workflows/build.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Probe latest upstream release
        id: comps
        run: |
          set -e
          latest_tag=$(curl -fsSL -H "Accept: application/vnd.github+json" https://api.github.com/repos/fatedier/frp/releases/latest | jq -r .tag_name)
          version="${latest_tag#v}"
          echo "frp_version=${version}"
          echo "frp=${version}" > /tmp/components.txt
          sha256sum Dockerfile >> /tmp/components.txt
          cat /tmp/components.txt
          echo "digest=$(sha256sum /tmp/components.txt | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y.%m.%d)" >> "$GITHUB_OUTPUT"
          echo "components=frps-${version}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Compare with last build
        id: diff
        run: |
          prev=""
          cid=$(docker create ghcr.io/${{ github.repository }}:latest 2>/dev/null || true)
          if [ -n "$cid" ]; then
            prev=$(docker inspect --format '{{index .Config.Labels "io.wannaknowhys.digest"}}' "$cid" 2>/dev/null || true)
            docker rm -f "$cid" >/dev/null 2>&1 || true
          fi
          if [ "$prev" = "${{ steps.comps.outputs.digest }}" ]; then
            echo "Components unchanged, skipping push"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to GHCR
        if: steps.diff.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (with component labels)
        if: steps.diff.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            FRP_VERSION=${{ steps.comps.outputs.version }}
          labels: |
            org.opencontainers.image.title=frps
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.comps.outputs.date }}
            io.wannaknowhys.build-date=${{ steps.comps.outputs.date }}
            io.wannaknowhys.digest=${{ steps.comps.outputs.digest }}
            io.wannaknowhys.components=${{ steps.comps.outputs.components }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.comps.outputs.date }}
            ghcr.io/${{ github.repository }}:v${{ steps.comps.outputs.version }}
